name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check plist files
        run: plutil -lint info.plist prefs.plist

      - name: Check bundled config JSON
        run: python3 -m json.tool config/alfred/la.json >/tmp/la-config.json

      - name: Compile JXA scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/la-osacompile"
          for script in scripts/*.js; do
            osacompile -l JavaScript -o "$RUNNER_TEMP/la-osacompile/$(basename "$script" .js).scpt" "$script"
          done
